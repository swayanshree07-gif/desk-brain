<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Brain</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a href="#/" class="brand">Desk Brain</a>
  <nav><a href="#/graph">Graph</a><a href="#/doubts">Doubts</a></nav>
  <form id="search-form" role="search">
    <input id="q" type="search" placeholder="Search the desk…  (press / to focus)" autocomplete="off">
    <select id="mode" title="Search mode">
      <option value="hybrid">hybrid</option>
      <option value="keyword">keyword</option>
      <option value="semantic">meaning</option>
    </select>
    <label class="opt"><input id="all" type="checkbox"> all sections</label>
  </form>
  <span id="status" class="muted"></span>
  <button id="reindex" type="button" title="Re-index changed pages">Re-index</button>
</header>
<main id="main"></main>
<script src="/static/graph.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
